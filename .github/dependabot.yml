version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly }
    ignore:
      # Must match the Node.js major in the Dockerfile — upgraded together, by hand
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      backend-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "deps(backend)" }

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor:
        update-types: [minor, patch]
    commit-message: { prefix: "deps(frontend)" }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
    commit-message: { prefix: "ci" }

  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      # Node.js majors are upgraded deliberately (Dockerfile + CI + engines + @types/node)
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message: { prefix: "deps(docker)" }
